name: Firebase Deploy

# Reusable. Called by repositories in this organization that deploy to Firebase;
# never runs on its own, because `workflow_call` is the only trigger.
#
# `firebase deploy --only <targets>` deploys what the repository's firebase.json
# says each target is: a Hosting site, Firestore or Storage rules, Functions.
# Nothing here knows which, the way release-cloudrun.yml knows nothing about
# the Dockerfile it hands over. firebase.json is the contract: a target that
# needs a build runs it in its `predeploy` hook, so a deploy from a laptop
# builds the same way this one does.
#
#   jobs:
#     deploy:
#       uses: ninoverse/.github/.github/workflows/firebase-deploy.yml@v1.2.3
#       with:
#         project: my-project
#         only: hosting:site
#       secrets:
#         firebase-service-account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
#
# The caller supplies the trigger, such as a push of the `v*` tag that
# <ecosystem>-bump-version.yml creates.
#
# Contract: the calling repository pins pnpm in package.json's `packageManager`
# and Node in `.nvmrc`, as node-ci.yml requires. Its dependencies are installed
# before the deploy, so the predeploy hooks can run its scripts.
#
# Pin a released version, not @main and not a short @v1: @main lands in every
# repository at once with no pull request, and @v1 never moves at all.

on:
  workflow_call:
    inputs:
      project:
        description: "Firebase project id."
        type: string
        required: true
      only:
        description: >
          What to deploy, as `firebase deploy --only` takes it: comma-separated
          targets such as `hosting:site` or `hosting:site,firestore:rules`.
          Required, so a deploy never takes everything firebase.json lists by
          accident.
        type: string
        required: true
    secrets:
      firebase-service-account:
        description: >
          Service account JSON key. Needs a role for each service it deploys,
          such as Firebase Hosting Admin for a Hosting target.
        required: true

# No `id-token: write`: this authenticates with a service account key, not
# Workload Identity Federation, so nothing here mints an OIDC token.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Writes the key to a file and points GOOGLE_APPLICATION_CREDENTIALS at
      # it, which is where the Firebase CLI looks.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.firebase-service-account }}

      # The CLI is fetched at the version pinned here, in this job alone, rather
      # than kept as a devDependency that every CI job would install.
      - name: Deploy
        env:
          PROJECT: ${{ inputs.project }}
          ONLY: ${{ inputs.only }}
          # renovate: datasource=npm depName=firebase-tools
          FIREBASE_TOOLS_VERSION: 15.32.1
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only "$ONLY" \
            --project "$PROJECT" \
            --non-interactive
