name: Node Release

# Reusable. Called by Node repositories in this organization when a `v*` tag is
# pushed; never runs on its own, because `workflow_call` is the only trigger.
#
# Builds the package, packs it with `pnpm pack`, and attaches the tarball to the
# tag's GitHub release alongside a SHA256SUMS. The release body is the caller's
# `extra-notes` first, then the conventional-commit changelog since the previous
# tag, written as rust-release.yml writes it.
#
# Contract: the calling repository pins pnpm in package.json's `packageManager`
# and Node in `.nvmrc`, and has a `build` script, as node-ci.yml requires.
# `pnpm pack` takes what package.json's `files` lists, so the tarball holds what
# a registry would serve.
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: ninoverse/.github/.github/workflows/node-release.yml@v1.2.3
#
# That `permissions` block is required and belongs on the calling job. A called
# workflow can only downgrade the permissions it is handed, never raise them, so
# the `contents: write` the publish job below declares is capped by whatever the
# caller grants. Without it the run builds and packs, then fails the publish
# with a 403.
#
# A release is not a publish: nothing here reaches a registry. The tarball keeps
# the name `pnpm pack` gives it, `<scope>-<name>-<version>.tgz`.
#
# Concurrency belongs in the caller, not here: inside a called workflow,
# `github.workflow` still resolves to the caller's name.
#
# The tag this runs on is the one node-bump-version.yml pushes. That only works
# because that workflow pushes with a GitHub App token: a tag pushed with
# GITHUB_TOKEN deliberately does not trigger other workflows, so a caller
# watching for the tag would never fire.
#
# Pin a released version, not @main and not a short @v1: @main lands in every
# repository at once with no pull request, and @v1 never moves at all.

on:
  workflow_call:
    inputs:
      extra-notes:
        description: >
          Markdown the calling repository computed about itself, prepended above
          the changelog. Empty — the default — omits the section entirely. It is
          an input and never a script this workflow runs out of the caller: a
          shared workflow executing repository-supplied code inside the run
          holding the organization's token widens the blast radius to every
          repository at once.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Read-only, unlike the publish job: installing and building run the
  # dependencies' code, which never sees a token that can write.
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The bump workflow writes both from one number, but a tag pushed by hand
      # can disagree, and a wrong release is corrected by the next version,
      # never by moving its tag.
      - name: Check the tag names the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::package.json says ${version}, but the tag is ${TAG}."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  release:
    needs: build
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the tarball to it.
      contents: write
    steps:
      # Full history and tags: the changelog is a range against the previous
      # tag, and `git describe` cannot find one in the shallow clone checkout
      # defaults to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package

      # This step and the next are copied in rust-release.yml. Change both
      # files together.
      - name: Write the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "${previous}" ]; then
            echo "Changelog covers ${previous}..${TAG}"
            range="${previous}..${TAG}"
          else
            echo "No previous tag; changelog covers all history up to ${TAG}"
            range="${TAG}"
          fi

          # Subjects only, and the same parse `node-bump-version.yml` already
          # ran: that subject line decided this version number, so reading it
          # again here is one contract read twice, not two sources of truth.
          # The release commit itself is dropped — it is the tag, not a change
          # in it — which is the same commit that workflow skips.
          git log --no-merges --reverse --format='%s' "${range}" \
            | grep -v -E '^chore: release v' > subjects.txt || true

          section() {
            local heading="$1" pattern="$2" body
            body=$(grep -E "${pattern}" subjects.txt \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: */- /' || true)
            if [ -n "${body}" ]; then
              printf '### %s\n\n%s\n\n' "${heading}" "${body}" >> changelog.md
            fi
          }

          : > changelog.md
          section "Breaking changes" '^[a-z]+(\([^)]*\))?!:'
          section "Features"         '^feat(\([^)]*\))?:'
          section "Fixes"            '^fix(\([^)]*\))?:'
          section "Performance"      '^perf(\([^)]*\))?:'
          section "Other changes"    '^(refactor|revert|style|chore|docs|test|build|ci)(\([^)]*\))?:'

          if [ ! -s changelog.md ]; then
            # The backticks are markdown for the release body, not command
            # substitution, so the single quotes are right and expansion is not
            # wanted. shellcheck sees only the backticks.
            # shellcheck disable=SC2016
            printf 'No conventional-commit changes since `%s`.\n\n' "${previous:-the start of history}" \
              >> changelog.md
          fi

          cat changelog.md

      # Prepended, not appended. Renovate embeds this whole body in a bump pull
      # request in every repository that pins the caller, and what a consumer is
      # reading for is what the caller knows about itself — the tool's own
      # changelog belongs beneath it.
      - name: Assemble the release body
        env:
          EXTRA_NOTES: ${{ inputs.extra-notes }}
        run: |
          set -euo pipefail
          : > notes.md
          if [ -n "${EXTRA_NOTES}" ]; then
            printf '%s\n\n' "${EXTRA_NOTES}" >> notes.md
          fi
          cat changelog.md >> notes.md
          cat notes.md

      - name: Checksum the tarball
        working-directory: ${{ runner.temp }}/package
        run: sha256sum -- *.tgz > SHA256SUMS

      # Creating and re-running are the same command as far as a maintainer is
      # concerned, so both work. Without the second branch a manual re-run would
      # be decoration: a run that died mid-upload leaves the release already
      # created, and `gh release create` refuses to touch it.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --clobber "$RUNNER_TEMP"/package/*.tgz "$RUNNER_TEMP/package/SHA256SUMS"
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file notes.md \
              "$RUNNER_TEMP"/package/*.tgz "$RUNNER_TEMP/package/SHA256SUMS"
          fi
