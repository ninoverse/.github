name: CI

# This repository's own gate. Everything else here is a reusable workflow that
# other repositories call, so a mistake in one of these files reaches every
# repository in the organization — and every merge cuts a release, which means
# a broken workflow gets a version number before anyone runs it.
#
# It calls actionlint.yml, the job every other repository calls by version, by
# relative path instead, so the gate is defined once and a change to it is
# linted by the version on its own branch.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: ./.github/workflows/actionlint.yml
