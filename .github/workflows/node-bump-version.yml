name: Node Bump Version

# Reusable. Called by Node repositories in this organization on every push to
# the default branch; never runs on its own, because `workflow_call` is the only
# trigger.
#
# Reads the conventional-commit type off the pushed commit, bumps the version in
# package.json with `pnpm version`, commits, and pushes a matching tag. The same
# shape as rust-bump-version.yml, because a Node package has a version field as
# a Rust workspace does, and a separate file for the reason the CI workflows
# are: the toolchain and the tool that edits the version share nothing.
#
#   jobs:
#     bump:
#       uses: ninoverse/.github/.github/workflows/node-bump-version.yml@v1.2.3
#       with:
#         app-id: ${{ vars.RELEASE_APP_ID }}
#       secrets:
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# Contract: the calling repository pins pnpm in package.json's `packageManager`
# and Node in `.nvmrc`, as node-ci.yml requires.
#
# The GitHub App is not optional and not interchangeable with GITHUB_TOKEN. A
# tag pushed with GITHUB_TOKEN deliberately does not trigger other workflows, so
# the release workflow watching for that tag would never fire. See
# CONTRIBUTING.md for what the app needs.
#
# Pin a released version, not @main and not a short @v1: @main lands in every
# repository at once with no pull request, and @v1 never moves at all.

on:
  workflow_call:
    inputs:
      app-id:
        description: "Release GitHub App id, normally vars.RELEASE_APP_ID."
        type: string
        required: true
    secrets:
      app-private-key:
        description: "Release GitHub App private key, normally secrets.RELEASE_APP_PRIVATE_KEY."
        required: true

# Read-only on purpose. Both the checkout and the push authenticate with the app
# token below, so GITHUB_TOKEN never needs write access to anything.
permissions:
  contents: read

jobs:
  bump-and-tag:
    # Skip this workflow's own release commit, or it would bump on its own push
    # forever.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - name: Check the release app credentials are configured
        env:
          APP_ID: ${{ inputs.app-id }}
          PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_ID or RELEASE_APP_PRIVATE_KEY is not set." \
                 "Set both at organization level — see ninoverse/.github CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the tag this job creates cannot collide
          # with one that already exists.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The same rules are copied in rust-bump-version.yml and
      # go-bump-version.yml. Change all three together.
      - name: Determine the bump type from the commit subject
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          msg=$(echo "$COMMIT_MSG" | head -n 1)
          bump="skip"

          echo "Analyzing commit subject: $msg"

          if [[ "$msg" =~ ^[a-z]+(\([a-z0-9_-]+\))?!: ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            bump="major"
          elif [[ "$msg" =~ ^feat(\([a-z0-9_-]+\))?: ]]; then
            bump="minor"
          elif [[ "$msg" =~ ^(fix|perf|refactor|revert|style|chore|docs)(\([a-z0-9_-]+\))?: ]]; then
            bump="patch"
          fi

          echo "Computed bump=$bump"
          echo "type=$bump" >> "$GITHUB_OUTPUT"

      # pnpm from `packageManager` and Node from `.nvmrc`, as in node-ci.yml.
      # Nothing is installed: `pnpm version` only edits package.json.
      - uses: pnpm/action-setup@v4
        if: steps.bump.outputs.type != 'skip'

      - uses: actions/setup-node@v4
        if: steps.bump.outputs.type != 'skip'
        with:
          node-version-file: .nvmrc

      - name: Bump the package version
        id: ver
        if: steps.bump.outputs.type != 'skip'
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          set -euo pipefail
          # No commit or tag here: the next step makes both, and pushes them
          # with the app token.
          pnpm version "$BUMP_TYPE" --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")

          echo "Next version: $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.bump.outputs.type != 'skip'
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW_VERSION already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "chore: release v$NEW_VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}" --follow-tags
