name: Go CI

# Reusable. Called by Go repositories in this organization; never runs on its
# own, because `workflow_call` is the only trigger.
#
# Contract: the calling repository has a Makefile exposing `fmt-check`, `vet`,
# `lint`, `test-race`, `vuln`, `licenses` and `cover`, plus a `tools-<gate>`
# target installing only that gate's binary. The target names are the contract,
# not the go commands behind them — CI calls the target so each command, and the
# golangci-lint version pin, keeps exactly one definition.
#
#   jobs:
#     ci:
#       uses: ninoverse/.github/.github/workflows/go-ci.yml@v1
#       with:
#         go-version: "1.25"
#
# Pin the tag, not @main. A change to @main lands in every repository at once,
# with no pull request in any of them.

on:
  workflow_call:
    inputs:
      go-version:
        description: >
          The `go` directive in go.mod, repeated. Every other job reads that same
          directive out of the file, so this is deliberately redundant: it is an
          assertion, checked against the file on every run. Bump go.mod without
          bumping this and the floor job installs the older toolchain, hits
          go.mod's own requirement, and fails by name — which is the point.
        type: string
        required: true
      licenses:
        description: "Run the go-licenses gate. Turn off for repositories with no license policy."
        type: boolean
        default: true
      coverage:
        description: "Build the HTML coverage report and upload it as an artifact."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The four merge gates, one job each so a red check names the gate that broke.
  #
  # Every gate resolves its toolchain from go.mod rather than tracking `stable`.
  # golangci-lint is pinned by the calling repository, and a pinned analyzer
  # only understands the Go releases it was built against — its bundled
  # staticcheck parses the standard library's own source, so a new Go release
  # makes it panic outright, not merely miss a lint. Tracking `stable` would
  # therefore turn every repository red the week Go ships, with no commit in
  # any of them: the same drift centralizing these workflows exists to remove.
  # Moving to a new Go release stays a deliberate edit to go.mod.
  fmt:
    name: Gate 1 — fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Reads the `go` directive, and only that: setup-go v5 matches
          # /^go (\d+(\.\d+)*)/ and never looks at `toolchain`. Its README on
          # main describes reading `toolchain` too — that is a later version
          # than the one pinned here, so do not rely on it.
          go-version-file: go.mod
          # setup-go's cache needs a lockfile and fails outright without one
          # ("Dependencies lock file is not found"). A module with no
          # dependencies has no go.sum, so guard on it — caching then turns
          # itself on the moment the repository gains a dependency.
          cache: ${{ hashFiles('go.sum') != '' }}
      - run: make tools-lint
      - run: make fmt-check

  lint:
    name: Gate 2 — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ hashFiles('go.sum') != '' }}
      - run: make tools-lint
      - run: make vet
      - run: make lint

  test:
    name: Gate 3 — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ hashFiles('go.sum') != '' }}
      - run: make tools-test
      - run: make test-race

  # Rust gets both halves from one `cargo deny check`; Go needs two tools, so
  # they are two steps under one gate rather than two gates. `vuln` is not
  # optional — a known CVE is not a policy choice — but `licenses` is, because
  # go-licenses has no config file to express an allowlist in.
  supply-chain:
    name: Gate 4 — licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ hashFiles('go.sum') != '' }}
      - run: make tools-vuln
      - run: make vuln
      - if: inputs.licenses
        run: make tools-licenses
      - if: inputs.licenses
        run: make licenses

  min-go:
    name: Go ${{ inputs.go-version }}
    runs-on: ubuntu-latest
    env:
      # This is not the MSRV job's equivalent, however much it looks like one.
      # Rust needs that job because nothing on the stable toolchain enforces
      # rust-version; Go enforces the `go` directive on every build, in every
      # job here, so the floor is already covered.
      #
      # What this job adds is the two things that are not covered. Under the
      # default GOTOOLCHAIN=auto a dependency requiring a newer Go makes the
      # toolchain silently download and use it, so the gates go green while the
      # declared floor has quietly become a lie; `local` forbids the download
      # and turns that into a failure. And installing inputs.go-version rather
      # than reading go.mod checks the caller's declared floor against the file
      # — they are the same number from two sources, so drift between them
      # surfaces here instead of going unnoticed.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ hashFiles('go.sum') != '' }}
      - name: Show the toolchain actually in use
        run: go version
      - name: Check the module builds with no toolchain upgrade
        run: go build ./...

  coverage:
    name: Coverage
    if: inputs.coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ hashFiles('go.sum') != '' }}
      - run: make tools-test
      - name: Generate the coverage profile
        run: make cover
      - name: Render it as HTML
        run: go tool cover -html=coverage.txt -o coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage.html
          retention-days: 14
