name: actionlint

# Reusable. Called by every repository in this organization, whatever its
# ecosystem, as one more job in its CI caller:
#
#   jobs:
#     workflows:
#       uses: ninoverse/.github/.github/workflows/actionlint.yml@v1.2.3
#
# actionlint rather than a YAML linter: it knows the workflow schema, so it
# catches an unknown key, a bad `needs:` reference or an expression that cannot
# type-check, none of which are YAML errors. Run through the published image
# rather than the bare binary because the image bundles shellcheck, and `run:`
# blocks are where a workflow's real logic usually is.
#
# The one gate with no runner recipe behind it. Workflow files are the same kind
# of file in every repository, so the tool is pinned here, once, and every
# repository lints with the same actionlint. Renovate keeps the image tag
# current: the github-actions manager reads `docker://` references the same way
# it reads any other `uses:`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
