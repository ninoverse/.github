name: Renovate

# Central and self-hosted: one run updates every ninoverse repository that has
# opted in, on this repository's own Actions minutes. Actions is unmetered for
# public repositories, so updating the private ones costs nothing.
#
# A repository opts in with a one-line renovate.json extending the shared
# preset in default.json. RENOVATE_REQUIRE_CONFIG below means a repository
# without that file is skipped rather than onboarded, so adoption is never
# something this workflow does to a repository on its own.
#
# Requires a GitHub App installed on the organization — see CONTRIBUTING.md.
# GITHUB_TOKEN cannot be used: it reaches only this repository, and pull
# requests opened with it deliberately do not trigger other workflows, so CI
# would never run on a dependency PR, which is the one thing that makes these
# safe to merge.

on:
  schedule:
    # 04:00 UTC is when this asks to run, not when it runs. GitHub delays
    # scheduled workflows under load, and the only run that has ever fired this
    # way started at 09:26 — five and a half hours late. The preset's window is
    # the whole of Monday for that reason: Renovate evaluates its own schedule
    # when it would create a branch, so a narrow window plus a delayed start
    # means it extracts dependencies and opens nothing.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run without creating branches, PRs or issues"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
  # Re-run when the shared config changes, so a mistake surfaces immediately
  # rather than next Monday — and a mistake here now affects every repository.
  # It validates rather than delivers: the preset's `schedule` is evaluated when
  # a branch would be created, so a run outside the Monday window extracts
  # dependencies and opens no pull request.
  push:
    branches: [main]
    paths:
      - default.json
      - renovate.json
      - .github/workflows/renovate.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Central Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the app credentials are missing
        env:
          APP_ID: ${{ vars.RENOVATE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${PRIVATE_KEY}" ]; then
            echo "::error::RENOVATE_APP_ID (variable) and RENOVATE_APP_PRIVATE_KEY (secret) must both be set at organization level. See CONTRIBUTING.md."
            exit 1
          fi

      # `owner` with `repositories` omitted mints a token scoped to the whole
      # installation, which is what makes one run cover every repository.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # dryRun is an enum (extract | lookup | full), not a boolean, and there is
      # no way to express "unset" from an `env:` expression — it would resolve
      # to an empty string, which is not a valid value. So set it only when it
      # is actually wanted.
      - name: Enable dry run
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      # The action and the tool it runs are versioned independently: this action
      # is v46, while Renovate itself is at 44.x. Left alone the action supplies
      # its own default (a floating major), so the version actually doing the
      # work would be invisible here and would change without a diff. Pinning it
      # exactly makes it reviewable; the annotation below is what lets Renovate
      # keep the pin current, via the customManager in default.json.
      - uses: renovatebot/github-action@v46.2.6
        with:
          token: ${{ steps.app-token.outputs.token }}
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.66.1
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "true"
          # The app is only installed on this organization, but the filter keeps
          # that true by configuration rather than by installation state.
          RENOVATE_AUTODISCOVER_FILTER: "ninoverse/*"
          # Skip repositories with no renovate.json instead of onboarding them.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          # App-only. Commits go through GitHub's API, so they are signed and
          # GitHub sets the author itself — which is why no gitAuthor is
          # configured anywhere in this repository.
          RENOVATE_PLATFORM_COMMIT: "enabled"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Post-upgrade commands are blocked outright unless they match one
          # of these patterns. The option is global-only, which is the whole
          # point: a repository cannot add to it from its own renovate.json, so
          # extending the agentcfg preset can never make this run execute
          # something the organization has not already allowed here.
          #
          # These three regenerate a repository's composed agent rule files
          # after its .agentprofile.yml pin is bumped, so the new pin and the
          # files it produces land in one commit — see postUpgradeTasks in
          # default.json. They are matched against the command *after* its
          # Handlebars template is compiled, and the match is unanchored, so
          # each pattern anchors itself and pins the tag shape rather than
          # accepting any URL under the releases path.
          #
          # Renovate reads an array-typed variable as JSON5 before falling back
          # to splitting on commas, so the doubled backslashes below are JSON
          # escapes and reach the regex engine as single ones.
          #
          # A command that misses the allowlist records an artifact error on the
          # pull request rather than passing quietly, which is the failure worth
          # having.
          RENOVATE_ALLOWED_COMMANDS: >-
            [
            "^curl --fail --silent --show-error --location --create-dirs --output \\.agentcfg/agentcfg https://github\\.com/ninoverse/agent-config-sync/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/agentcfg-x86_64-unknown-linux-musl$",
            "^chmod \\+x \\.agentcfg/agentcfg$",
            "^\\.agentcfg/agentcfg sync$"
            ]
