name: Rust Bump Version

# Reusable. Called by Rust repositories in this organization on every push to
# the default branch; never runs on its own, because `workflow_call` is the only
# trigger.
#
# Reads the conventional-commit type off the pushed commit, bumps
# [workspace.package].version accordingly, commits, and pushes a matching tag.
# Every crate inherits the version via `version.workspace = true`, so the whole
# workspace moves in lockstep.
#
#   jobs:
#     bump:
#       uses: ninoverse/.github/.github/workflows/rust-bump-version.yml@v1
#       with:
#         app-id: ${{ vars.RELEASE_APP_ID }}
#       secrets:
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# The GitHub App is not optional and not interchangeable with GITHUB_TOKEN. A
# tag pushed with GITHUB_TOKEN deliberately does not trigger other workflows, so
# the release workflow watching for that tag would never fire. See
# CONTRIBUTING.md for what the app needs.
#
# Pin the tag, not @main. A change to @main lands in every repository at once,
# with no pull request in any of them.

on:
  workflow_call:
    inputs:
      app-id:
        description: "Release GitHub App id, normally vars.RELEASE_APP_ID."
        type: string
        required: true
    secrets:
      app-private-key:
        description: "Release GitHub App private key, normally secrets.RELEASE_APP_PRIVATE_KEY."
        required: true

# Read-only on purpose. Both the checkout and the push authenticate with the app
# token below, so GITHUB_TOKEN never needs write access to anything.
permissions:
  contents: read

jobs:
  bump-and-tag:
    # Skip this workflow's own release commit, or it would bump on its own push
    # forever.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - name: Check the release app credentials are configured
        env:
          APP_ID: ${{ inputs.app-id }}
          PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_ID or RELEASE_APP_PRIVATE_KEY is not set." \
                 "Set both at organization level — see ninoverse/.github CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the tag this job creates cannot collide
          # with one that already exists.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine the bump type from the commit subject
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          msg=$(echo "$COMMIT_MSG" | head -n 1)
          bump="skip"

          echo "Analyzing commit subject: $msg"

          if [[ "$msg" =~ ^[a-z]+(\([a-z0-9_-]+\))?!: ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            bump="major"
          elif [[ "$msg" =~ ^feat(\([a-z0-9_-]+\))?: ]]; then
            bump="minor"
          elif [[ "$msg" =~ ^(fix|perf|refactor|revert|style|chore|docs)(\([a-z0-9_-]+\))?: ]]; then
            bump="patch"
          fi

          echo "Computed bump=$bump"
          echo "type=$bump" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.bump.outputs.type != 'skip'

      # cargo-edit is not in install-action's manifest, so this goes through its
      # cargo-binstall fallback. Still preferable to calling cargo-binstall
      # directly: one action, already pinned, already used by every other
      # workflow here.
      - uses: taiki-e/install-action@v2
        if: steps.bump.outputs.type != 'skip'
        with:
          tool: cargo-edit

      - name: Bump the workspace version
        id: ver
        if: steps.bump.outputs.type != 'skip'
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          set -euo pipefail
          cargo set-version --bump "$BUMP_TYPE" --workspace

          # Read the version back from the whole workspace rather than from one
          # named crate. Erroring on divergence is the point: a workspace whose
          # crates have drifted apart has no single version to tag, and picking
          # one silently would tag the wrong thing.
          new_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique
                     | if length == 1 then .[0]
                       else error("crates have divergent versions: \(.)") end')

          echo "Next version: $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.bump.outputs.type != 'skip'
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW_VERSION already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "chore: release v$NEW_VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}" --follow-tags
