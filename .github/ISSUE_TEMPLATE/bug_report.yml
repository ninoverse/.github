name: Bug report
description: Something behaves differently from what it documents
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: >
        Paste the real error, not a paraphrase of it. Rendered as a code block,
        so no backticks are needed.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Whatever is relevant — operating system, toolchain or runtime version,
        and the version or commit of this project you are on.
      placeholder: |
        OS:
        Toolchain:
        Version/commit:
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Workarounds you found, or what you already ruled out.
    validations:
      required: false
